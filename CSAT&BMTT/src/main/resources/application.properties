spring.application.name=CSAT-BMTT
# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3307/csat_bmtt?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# DB Initialization (disable SQL init)
spring.sql.init.mode=never

# ─── AES Keys (16 bytes = AES-128) ──────────────────────────────
# KEY DÙNG ĐỂ MÃ HÓA QUÁ TRÌNH TRUYỀN (FE <-> BE)
app.aes.transport-key=TransportKey1234

# KEY DÙNG ĐỂ MÃ HÓA DỮ LIỆU LƯU DB (Data-at-Rest)
app.aes.key=DbEncryptKey12!@

# ─── Server ─────────────────────────────────────────────────────
server.port=8081
