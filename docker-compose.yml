version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: csat_bmtt_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: csat_bmtt
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./CSAT&BMTT/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./CSAT&BMTT/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql

volumes:
  db_data:
